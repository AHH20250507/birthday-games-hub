<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="scroll-restoration" content="manual">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230071e3'/%3E%3Crect x='15' y='27' width='34' height='23' rx='4' fill='%23fff'/%3E%3Crect x='12' y='21' width='40' height='8' rx='3' fill='%23ff9500'/%3E%3Crect x='29' y='21' width='6' height='29' fill='%23ff2d55'/%3E%3Ccircle cx='25' cy='16' r='6' fill='%23ff2d55'/%3E%3Ccircle cx='39' cy='16' r='6' fill='%23ff2d55'/%3E%3Ccircle cx='32' cy='19' r='3.2' fill='%2334c759'/%3E%3C/svg%3E">
<title>绿怡生日会工作台</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --blue:#0071e3; --blue-soft:#e8f2fd;
  --text:#1d1d1f; --muted:#6e6e73; --faint:#8e8e93;
  --line:#e3e3e6; --line-2:#d2d2d7;
  --green:#248a3d; --green-soft:#e6f4ea;
  --orange:#b25000; --orange-soft:#fdf0e6;
  --red:#c0272d; --red-soft:#fdeceb;
  --purple:#6b3fa0; --purple-soft:#f1ebf9;
  --pink:#ff2d55; --pink-soft:#ffe9ee;
  --amber:#ff9500; --amber-soft:#fff1e3;
  --mint:#34c759; --mint-soft:#e7f8ec;
  --grape:#af52de; --grape-soft:#f4ecfb;
  --r:14px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.55; letter-spacing:0;
}
button,input,textarea,select{letter-spacing:0}
button{transition:background-color .15s ease,border-color .15s ease,opacity .15s ease}
button:active{opacity:.7}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* header */
header{background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.header-inner{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-top:22px;padding-bottom:16px;flex-wrap:wrap}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:2px}
.tabs button,.tabs .tab-link{border:0;background:transparent;font:inherit;font-size:15px;color:var(--text);padding:7px 18px;border-radius:8px;cursor:pointer;text-decoration:none;line-height:1.6}
.tabs button.on{background:var(--card);font-weight:500;box-shadow:0 0 0 .5px rgba(0,0,0,.06)}
.tabs button[data-view="plan"]{position:relative}
.plan-badge{position:absolute;top:-7px;right:-5px;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border:2px solid var(--card);border-radius:999px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;line-height:14px;box-shadow:0 1px 3px rgba(0,0,0,.16)}
.plan-badge[hidden]{display:none!important}

main.wrap{padding-top:32px;padding-bottom:80px}
h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.card h2{letter-spacing:-.02em}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;flex-shrink:0;display:flex}
.hdr-right{display:flex;align-items:center;gap:10px}
.gearbtn{border:1px solid var(--line-2);background:var(--card);width:38px;height:38px;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;margin-bottom:2px}
.herodot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.review-link{display:inline-block;text-decoration:none}
.aithumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.aithumb img{width:100%;height:100%;object-fit:cover;display:block}
.aithumb button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.55);color:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}

/* filters */
.filters{background:var(--card);border-radius:var(--r);padding:6px 22px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.filter-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filter-summary{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:160px}
.filter-summary b{font-weight:500;color:var(--text)}
.filter-bar .field{flex:1;max-width:320px;min-width:180px;border:1px solid var(--line-2);border-radius:10px;padding:9px 14px;font:inherit;font-size:16px;background:var(--card);color:var(--text)}
.filter-bar .field:focus{outline:0;border-color:var(--blue)}
.filter-bar .field{height:44px;padding-top:0;padding-bottom:0}.searchbox{position:relative;display:flex;align-items:center;flex:1;max-width:320px;min-width:180px}.searchbox .ico{position:absolute;left:14px;margin:0;color:var(--faint);z-index:1}.searchbox .field{max-width:none;padding-left:40px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.filter-bar .btn{height:44px;padding-top:0;padding-bottom:0;display:inline-flex;align-items:center;justify-content:center}
#filterBody[hidden]{display:none}
.filter-actions{display:flex;justify-content:flex-end;padding-top:14px}
.frow{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.flabel{font-size:15px;color:var(--muted);min-width:60px;padding-top:5px;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--card);color:var(--text);font:inherit;font-size:15px;padding:5px 14px;border-radius:100px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.ghost.on{background:var(--blue);border-color:var(--blue);color:#fff}
.search{flex:1;min-width:200px;border:1px solid var(--line-2);border-radius:10px;padding:9px 14px;font:inherit;font-size:16px;background:var(--card);color:var(--text)}
.search:focus{outline:0;border-color:var(--blue)}

/* toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.count{font-size:15px;color:var(--muted)}
.count b{color:var(--text);font-weight:600}
.tbtns{display:flex;gap:10px;flex-wrap:wrap}
.ico{width:16px;height:16px;display:inline-block;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:6px}.iconbtn .ico{margin:0;width:18px;height:18px}.btn{border:1px solid var(--line-2);background:var(--card);color:var(--text);font:inherit;font-size:15px;font-weight:500;padding:9px 16px;border-radius:10px;cursor:pointer;white-space:nowrap}.btn:hover{border-color:#a8a8ad;background:#fafafa}.btn.primary:hover,.btn.solid:hover{background:#0068d1;border-color:#0068d1}
.btn.primary,.btn.solid{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{font-size:14px;padding:7px 13px;border-radius:9px}.btn .ico{margin-right:5px}.icon-only{width:38px;padding-left:8px;padding-right:8px}
  .btn.ghost{color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.gcard{background:var(--card);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.025)}
.gcard.used{box-shadow:inset 0 0 0 1.5px var(--orange-soft)}
.ghead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.gname{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.star{border:0;background:transparent;cursor:pointer;padding:2px;flex-shrink:0;line-height:0}
.star svg{width:19px;height:19px}
.gtags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;color:var(--muted);background:var(--bg);padding:3px 10px;border-radius:6px;white-space:nowrap}
.tag.cat{color:var(--purple);background:var(--purple-soft)}
.tag.cus{color:var(--blue);background:var(--blue-soft)}
.tag.none{color:var(--green);background:var(--green-soft)}
.tag.buy{color:var(--orange);background:var(--orange-soft)}
.tag.used{color:var(--orange);background:var(--orange-soft)}
.gdesc{font-size:15px;color:var(--muted);line-height:1.65;flex:1}
.gfoot{display:flex;gap:8px;padding-top:2px}.gfoot .btn{flex:1;min-width:0}.gfoot .btn.ghost{flex:0 0 auto}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
.modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:22px;max-width:720px;width:100%;padding:32px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.mclose{position:absolute;top:22px;right:24px;border:0;background:transparent;font-size:26px;line-height:1;color:var(--faint);cursor:pointer}
.mtitle{font-size:25px;font-weight:600;letter-spacing:-.01em;padding-right:40px;line-height:1.35}
.msub{font-size:15px;color:var(--muted);margin-top:6px}
.msection{margin-top:26px}
.msection h3{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:10px}
.mtext{font-size:16px;line-height:1.75}
ol.steps{margin:0;padding-left:22px}
ol.steps li{margin-bottom:8px;font-size:16px;line-height:1.75}
.mbox.dropping{outline:2px dashed var(--blue);outline-offset:-10px}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin-bottom:7px;font-size:16px;line-height:1.7}
.pit{color:var(--red)}
.ptable{width:100%;border-collapse:collapse;font-size:15px}
.ptable th{text-align:left;font-weight:500;color:var(--muted);font-size:14px;padding:0 0 8px;border-bottom:1px solid var(--line)}
.ptable td{padding:9px 0;border-bottom:1px solid var(--line)}
.ptable tr:last-child td{border-bottom:0}
.ptable .num{text-align:right;font-variant-numeric:tabular-nums}
.mafoot{display:flex;gap:10px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;font:inherit;font-size:16px;background:var(--card);color:var(--text)}
.field:focus{outline:0;border-color:var(--blue)}
textarea.field{resize:vertical;min-height:64px;line-height:1.6}

/* plan */
.plan-head{margin-bottom:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;align-items:end}.plan-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1;min-width:280px}
.plan-head .full{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.plan-body{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.plan-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.plan-item:last-child{border-bottom:0}
.pidx{width:28px;height:28px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.pmain{flex:1;min-width:0}
.pname{font-size:17px;font-weight:500}
.plink{border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer;text-align:left}
.plink:hover{color:var(--blue)}
.pops{display:flex;gap:4px;flex-shrink:0}
.iconbtn{border:1px solid var(--line-2);background:var(--card);width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.iconbtn:disabled{opacity:.3;cursor:default}
.pside{position:sticky;top:100px}
.side-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:15px;border-bottom:1px solid var(--line)}
.side-row:last-child{border-bottom:0}
.side-row .v{font-variant-numeric:tabular-nums;color:var(--text)}
.side-row .v.mut{color:var(--muted)}
.plan-arrangement{font-size:14px;color:var(--muted);line-height:1.6;margin:5px 0 7px}.plan-arrangement b{color:var(--text)}
.ai-plan-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;background:var(--bg)}
.ai-plan-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ai-plan-role{font-size:13px;color:var(--muted);margin-bottom:5px}
.ai-plan-name{font-size:18px;font-weight:600}
.ai-plan-card.accepted{border-color:var(--green);background:#f1fbf4}
.ai-plan-card.rejected{border-color:#ffb8b3;background:#fff7f6}
.ai-plan-meta{font-size:14px;color:var(--muted);line-height:1.7;margin-top:9px}
.ai-plan-reason{font-size:15px;line-height:1.6;margin-top:8px}
.ai-plan-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ai-plan-actions .btn{font-size:14px;padding:7px 12px}
.ai-plan-empty{padding:14px 0;color:var(--muted);font-size:15px}
.empty{color:var(--faint);font-size:15px;padding:30px 0;text-align:center}

/* log */
.logform{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end;margin-bottom:18px}
.logform .full{grid-column:1/-1}
.logitem{padding:16px 0;border-bottom:1px solid var(--line)}
.logitem:last-child{border-bottom:0}
.logtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logdate{font-size:16px;font-weight:500}
.logocc{font-size:14px;color:var(--muted)}
.loggames{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.7}
.lognote{font-size:15px;margin-top:6px;color:var(--text)}
.statrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.statrow:last-child{border-bottom:0}
.statrow .n{width:22px;color:var(--faint);font-variant-numeric:tabular-nums;font-size:14px}
.statrow .nm{flex:1}
.bar{width:110px;height:7px;background:var(--bg);border-radius:100px;overflow:hidden;flex-shrink:0}
.bar i{display:block;height:100%;background:var(--orange);border-radius:100px}

/* editor */
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-top:6px}
.efull{grid-column:1/-1}
.efield label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.checks{display:flex;gap:16px;flex-wrap:wrap;align-items:center;min-height:44px}
.checks label{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
.checks input{width:17px;height:17px;accent-color:var(--blue)}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.prow .pn{flex:1;min-width:130px}
.prow input[type=number]{width:70px;text-align:center}
.prow .pu{width:58px;text-align:center}
.prow .del{border:1px solid var(--line-2);background:var(--card);width:30px;height:38px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:16px;flex-shrink:0}
.ehint{font-size:13px;color:var(--faint);margin-top:6px;line-height:1.6}

@media (max-width:860px){
  .plan-body{grid-template-columns:1fr;gap:12px}
  .pside{position:static}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  /* header */
  .header-inner{padding-top:14px;padding-bottom:12px;gap:10px}
  h1{font-size:21px}
  .logo{width:36px;height:36px}
  .brand{gap:10px}
  /* header：同步点+齿轮并入标题行，tabs 独占第二行 */
  .hdr-right{display:contents}
  #syncDot{order:1;margin:0 4px 0 auto !important;align-self:center}
  .gearbtn{order:2}
  .tabs{order:3;flex-basis:100%;width:100%;margin-top:10px}
  .tabs button,.tabs .tab-link{flex:1;padding:8px 4px;font-size:14px;white-space:nowrap}.plan-badge{top:-5px;right:0}
  .gearbtn{width:36px;height:36px}
  /* layout */
  main.wrap{padding-top:18px;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  h2{font-size:17px}
  .card{padding:18px 16px;border-radius:16px}
  /* filters */
  .filters{padding:2px 14px 14px;border-radius:16px}
  .filter-bar{padding:12px 0;gap:10px}
  .filter-summary{flex:1 1 100%}
  .filter-bar .field{flex:1;min-width:0;max-width:none}
  .frow{flex-direction:column;gap:8px}
  .flabel{padding-top:0;font-size:14px}
  .chip{padding:6px 13px;font-size:14px}
  /* toolbar + grid */
  .toolbar{margin-bottom:16px;gap:10px}
  .tbtns{width:100%}
  .tbtns .btn{flex:1;justify-content:center}
  .btn{padding:10px 16px}
  .grid{grid-template-columns:1fr;gap:12px}
  .gcard{padding:16px}
  .gname{font-size:17px}
  /* modal */
  .modal{padding:14px 8px}
  .mbox{padding:22px 16px 26px;border-radius:16px}
  .mtitle{font-size:20px}
  .mclose{top:12px;right:14px;font-size:24px}
  .msection{margin-top:20px}
  .mtext,ol.steps li,ul.plain li{font-size:15px}
  /* plan */
  .plan-head .full{flex-wrap:wrap}.plan-fields{grid-template-columns:1fr;min-width:0;width:100%}
  .plan-item{gap:10px}
  .pname{font-size:16px}
  .pidx{width:24px;height:24px;font-size:13px}
  .iconbtn{width:34px;height:34px}
  /* log */
  .statrow .bar{width:80px}
  .ptable{font-size:14px}
  .mafoot .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="19" width="24" height="15" rx="3" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.8"/>
          <rect x="6" y="15" width="30" height="6" rx="2" fill="#0071e3"/>
          <rect x="19" y="15" width="4" height="19" fill="#ff9500"/>
          <ellipse cx="15.5" cy="12.5" rx="5.5" ry="4.5" fill="#ff2d55"/>
          <ellipse cx="26.5" cy="12.5" rx="5.5" ry="4.5" fill="#ff2d55"/>
          <circle cx="21" cy="14.5" r="2.4" fill="#34c759"/>
        </svg>
      </span>
      <div>
        <h1>绿怡生日会工作台</h1>
      </div>
    </div>
    <div class="hdr-right">
      <nav class="tabs">
        <button data-view="lib" class="on">游戏库</button>
        <button data-view="plan" id="planTab">本次生日会<span class="plan-badge" id="planBadge" hidden>0</span></button>
        <button data-view="log">往期记录</button>
        <a class="tab-link" href="https://p1tnczsuynd.feishu.cn/drive/folder/Q1HJfVsWulf5p2dbGxCcl9k9nDc" target="_blank" rel="noopener">生日会回顾</a>
      </nav>
      <span id="syncDot" style="width:9px;height:9px;border-radius:50%;background:#c7c7cc;flex-shrink:0;margin-bottom:2px" title="同步未配置"></span>
      <button class="gearbtn" id="btnSettings" title="设置">

<div id="modal" class="modal" hidden></div>

<script>
var CATS = ['破冰暖场','分组对抗','爆笑整蛊','协作挑战','温情收尾'];

var GAMES = [];

var KEY = 'bgh_v1';
var SYNC_DEFAULT = 'lyi-2026';  /* 内置默认同步码：新设备无需填写，打开即自动全量同步 */
var AI_DEF = {url:'https://ai666.live/v1', key:'sk-FcfEByqfiggSPxsN9BfRnqNmrHCQpVn33kRf3zLkVC9ekjA6', model:'gpt-5.6-sol'};
var state = {stars:[], logs:[], user:[], edits:{}, hidden:[], aiGames:[], cur:{id:'',name:'',theme:'',who:'',date:'',people:'',items:[],scriptReq:'',script:'',aiPlanReq:'',aiPlan:[],archived:false}, ai:{url:AI_DEF.url,key:AI_DEF.key,model:AI_DEF.model,scriptPresets:['warm','time','link','ending'],scriptCustom:''}, sync:{code:SYNC_DEFAULT, lastSync:0}, _ts:0};
function ico(name){
  var p={search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',filter:'<path d="M4 5h16M7 12h10M10 19h4"/>',plus:'<path d="M12 5v14M5 12h14"/>',spark:'<path d="m12 3 1.7 6.3L20 11l-6.3 1.7L12 19l-1.7-6.3L4 11l6.3-1.7L12 3Z"/>',eye:'<path d="M2.5 12s3.3-5 9.5-5 9.5 5 9.5 5-3.3 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/>',trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/>',copy:'<rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 16V5a2 2 0 0 1 2-2h8"/>',edit:'<path d="m4 16-.8 4.8L8 20l11-11a2.8 2.8 0 0 0-4-4L4 16Z"/>',save:'<path d="M5 4h12l3 3v13H5zM8 4v6h8V4M8 20v-6h8v6"/>',image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 2-2 6 5"/>',refresh:'<path d="M20 11a8 8 0 0 0-14.7-4L3 10M3 5v5h5M4 13a8 8 0 0 0 14.7 4L21 14m0 5v-5h-5"/>',arrowUp:'<path d="m6 14 6-6 6 6"/>',arrowDown:'<path d="m6 10 6 6 6-6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>'};
  return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+(p[name]||'')+'</svg>';
}
function rawSave(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function save(){ state._ts=Date.now(); rawSave(); scheduleSync(); }
function load(){
  try{
    var r = JSON.parse(localStorage.getItem(KEY));
    if(!r) return;
    if(r.stars) state.stars = r.stars;
    if(r.logs) state.logs = r.logs;
    if(r.user) state.user = r.user;
    if(r.edits) state.edits = r.edits;
    if(r.hidden) state.hidden = r.hidden;
    if(r.aiGames) state.aiGames = r.aiGames;
    if(r.cur) state.cur = Object.assign(state.cur, r.cur);
    if(r.ai) state.ai = Object.assign({}, state.ai, r.ai);
    if(r.sync) state.sync = {code:r.sync.code||SYNC_DEFAULT, lastSync:r.sync.lastSync||0};
    if(r._ts) state._ts = r._ts;
  }catch(e){}
}
function ALL(){
  var out=[];
  GAMES.forEach(function(g){
    if(state.hidden.indexOf(g.id)>=0) return;
    out.push(state.edits[g.id] ? Object.assign({}, g, state.edits[g.id]) : g);
  });
  state.user.forEach(function(g){ if(state.hidden.indexOf(g.id)<0) out.push(g); });
  return out;
}
function isCustom(id){ return String(id).indexOf('u_')===0; }

var FCFG = [
  {k:'cat',   label:'环节', opts:CATS},
  {k:'ppl',   label:'人数', opts:['10人以下','10-20人','20-50人','50人以上']},
  {k:'dur',   label:'时长', opts:['5分钟内','5-15分钟','15-30分钟','30分钟以上']},
  {k:'venue', label:'场地', opts:['会议室','开阔场地','户外','座位上']},
  {k:'plv',   label:'道具', opts:['无道具','纸笔','手机','需采购']},
  {k:'noise', label:'音量', opts:['安静','中等','吵闹']}
];
var PRANGE = {'10人以下':[1,10],'10-20人':[10,20],'20-50人':[20,50],'50人以上':[50,999]};
var DRANGE = {'5分钟内':[0,5],'5-15分钟':[5,15],'15-30分钟':[15,30],'30分钟以上':[30,999]};
var NVAL = {'安静':1,'中等':2,'吵闹':3};
var NTXT = {1:'安静',2:'中等',3:'吵闹'};
var MTXT = {1:'原地',2:'走动',3:'跑动'};
var CAT_COLOR={'破冰暖场':'#0071e3','分组对抗':'#ff9500','爆笑整蛊':'#ff2d55','协作挑战':'#34c759','温情收尾':'#af52de','过渡':'#8e8e93'};
var CAT_TINT={'破冰暖场':'#e8f2fd','分组对抗':'#fff1e3','爆笑整蛊':'#ffe9ee','协作挑战':'#e7f8ec','温情收尾':'#f4ecfb','过渡':'#f2f2f4'};
function catStyle(cat){ return 'color:'+(CAT_COLOR[cat]||'#6e6e73')+';background:'+(CAT_TINT[cat]||'#f2f2f4'); }
var F = {cat:'',ppl:'',dur:'',venue:'',plv:'',noise:'',shy:false,star:false,fresh:false,q:'',collapsed:true};

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function gid(id){ var a=ALL(); for(var i=0;i<a.length;i++){ if(a[i].id===id) return a[i]; } return null; }
function starred(id){ return state.stars.indexOf(id)>=0; }
function lastPlayed(id){
  var d='';
  state.logs.forEach(function(l){ if(l.gids.indexOf(id)>=0 && l.date>d) d=l.date; });
  return d;
}
function daysAgo(ds){
  if(!ds) return 99999;
  var t=new Date(ds).getTime(); if(isNaN(t)) return 99999;
  return Math.floor((Date.now()-t)/86400000);
}
function playsCount(id){
  var n=0;
  state.logs.forEach(function(l){ if(l.gids && l.gids.indexOf(id)>=0) n++; });
  return n;
}
function inPlan(id){ for(var i=0;i<state.cur.items.length;i++){ if(state.cur.items[i].gid===id) return true; } return false; }

function match(g){
  if(F.cat && g.cat!==F.cat) return false;
  if(F.ppl){ var r=PRANGE[F.ppl]; if(!(g.min<=r[1] && g.max>=r[0])) return false; }
  if(F.dur){ var d=DRANGE[F.dur]; if(!(g.dur<=d[1] && g.dur>=d[0])) return false; }
  if(F.venue && g.venue.indexOf(F.venue)<0) return false;
  if(F.plv && g.pl!==F.plv) return false;
  if(F.noise && g.noise!==NVAL[F.noise]) return false;
  if(F.shy && !g.shy) return false;
  if(F.star && !starred(g.id)) return false;
  if(F.fresh && daysAgo(lastPlayed(g.id))<180) return false;
  if(F.q){
    var q=F.q.toLowerCase();
    var hay=(g.name+' '+g.cat+' '+g.desc+' '+(g.variants||[]).join(' ')).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function matched(){ return ALL().filter(match); }

function starSvg(on){
  return '<svg viewBox="0 0 24 24" fill="'+(on?'#e8a33d':'none')+'" stroke="'+(on?'#e8a33d':'#c7c7cc')+'" stroke-width="1.4" stroke-linejoin="round"><path d="M12 2.6l3 6.1 6.7 1-4.9 4.7 1.2 6.7L12 18l-6 2.9 1.2-6.7-4.9-4.7 6.7-1z"/></svg>';
}

/* ---------- 游戏库 ---------- */
function filtersHtml(){
  var h='';
  FCFG.forEach(function(f){
    h+='<div class="frow"><div class="flabel">'+f.label+'</div><div class="chips">';
    h+='<button class="chip" data-k="'+f.k+'" data-v="">全部</button>';
    f.opts.forEach(function(o){
      h+='<button class="chip" data-k="'+f.k+'" data-v="'+esc(o)+'">'+esc(o)+'</button>';
    });
    h+='</div></div>';
  });
  h+='<div class="frow"><div class="flabel">筛选</div><div class="chips">';
  h+='<button class="chip ghost" data-k="shy" data-v="1">社恐友好</button>';
  h+='<button class="chip ghost" data-k="star" data-v="1">只看收藏</button>';
  h+='<button class="chip ghost" data-k="fresh" data-v="1">排除半年内玩过的</button>';
  h+='</div></div>';
  h+='<div class="filter-actions"><button class="btn sm" id="btnClear">清空筛选</button></div>';
  return h;
}
function syncFilters(){
  document.querySelectorAll('#filterBody .chip').forEach(function(b){
    var k=b.getAttribute('data-k'), v=b.getAttribute('data-v');
    var on = (k==='shy'||k==='star'||k==='fresh') ? !!F[k] : (!F[k] ? v==='' : F[k]===v);
    b.classList.toggle('on', on);
  });
}
function renderFilterSummary(){
  var parts=[];
  FCFG.forEach(function(f){ if(F[f.k]) parts.push(f.label+'：'+F[f.k]); });
  if(F.shy) parts.push('社恐友好');
  if(F.star) parts.push('只看收藏');
  if(F.fresh) parts.push('排除半年内玩过的');
  if(F.q) parts.push('搜索「'+F.q+'」');
  $('#filterSummary').textContent = parts.length? parts.join(' · ') : '未选择筛选条件';
  $('#btnToggleFilter').textContent = F.collapsed? '展开筛选' : '收起筛选';
  $('#filterBody').hidden = F.collapsed;
}
$('#filterBody').innerHTML = filtersHtml();
$('#filters').addEventListener('click', function(e){
  if(e.target.id==='btnClear'){
    F={cat:'',ppl:'',dur:'',venue:'',plv:'',noise:'',shy:false,star:false,fresh:false,q:'',collapsed:false};
    renderLib();
    return;
  }
  var b=e.target.closest('.chip'); if(!b) return;
  var k=b.getAttribute('data-k'), v=b.getAttribute('data-v');
  if(k==='shy'||k==='star'||k==='fresh'){ F[k]=!F[k]; } else { F[k]=v; }
  renderLib();
});
$('#filters').addEventListener('input', function(e){
  if(e.target.id!=='q') return;
  F.q=e.target.value.trim();
  renderLib();
});
$('#btnToggleFilter').addEventListener('click', function(){
  F.collapsed=!F.collapsed;
  renderFilterSummary();
  syncFilters();
});

function cardHtml(g){
  var lp=lastPlayed(g.id), recent=daysAgo(lp)<180;
  var t='<div class="gcard'+(recent?' used':'')+'">';
  t+='<div class="ghead"><div class="gname">'+esc(g.name)+'</div>';
  t+='<button class="star" data-star="'+g.id+'" title="收藏">'+starSvg(starred(g.id))+'</button></div>';
  t+='<div class="gtags">';
  t+='<span class="tag" style="'+catStyle(g.cat)+'">'+esc(g.cat)+'</span>';
  if(isCustom(g.id)) t+='<span class="tag cus">自定义</span>';
  t+='<span class="tag">'+g.min+'-'+g.max+' 人</span>';
  t+='<span class="tag">'+g.dur+' 分钟</span>';
  t+='<span class="tag">'+esc(g.venue.join(' / '))+'</span>';
  t+='<span class="tag'+(g.pl==='无道具'?' none':(g.pl==='需采购'?' buy':''))+'">'+esc(g.pl)+'</span>';
  t+='<span class="tag">'+NTXT[g.noise]+'</span>';
  if(g.shy) t+='<span class="tag none">社恐友好</span>';
  if(recent) t+='<span class="tag used">'+esc(lp)+' 玩过</span>';
  t+='</div>';
  t+='<div class="gdesc">'+esc(g.desc)+'</div>';
  t+='<div class="gfoot"><button class="btn sm" data-open="'+g.id+'"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-5 9.5-5 9.5 5 9.5 5-3.3 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>详情</button>';
  t+='<button class="btn sm'+(inPlan(g.id)?'':' solid')+'" data-add="'+g.id+'"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'+(inPlan(g.id)?'移除':'加入')+'</button>';
  t+='<button class="btn sm ghost icon-only" data-del="'+g.id+'" title="删除游戏" aria-label="删除游戏"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></button></div>';
  t+='</div>';
  return t;
}

function renderLib(){
  syncFilters();
  renderFilterSummary();
  var list=matched();
  $('#count').innerHTML='共 <b>'+list.length+'</b> 个游戏';
  $('#grid').innerHTML = list.length? list.map(cardHtml).join('') : '<div class="empty">游戏库为空。请添加游戏。</div>';
}

$('#grid').addEventListener('click', function(e){
  var s=e.target.closest('[data-star]');
  if(s){ var id=s.getAttribute('data-star');
    var i=state.stars.indexOf(id);
    if(i>=0) state.stars.splice(i,1); else state.stars.push(id);
    save(); renderLib(); return; }
  var o=e.target.closest('[data-open]');
  if(o){ openGame(o.getAttribute('data-open')); return; }
  var a=e.target.closest('[data-add]');
  if(a){ togglePlan(a.getAttribute('data-add')); renderLib(); renderPlan(); }
  var dl=e.target.closest('[data-del]');
  if(dl){ delGameFromLib(dl.getAttribute('data-del')); }
});

/* ---------- 详情弹窗 ---------- */
var currentGid=null;
function openGame(id){
  var g=gid(id); if(!g) return;
  window.scrollTo(0,0);
  currentGid=id;
  var lp=lastPlayed(g.id);
  var h='<div class="mbox">';
  h+='<button class="mclose" onclick="closeModal()">&times;</button>';
  h+='<div class="mtitle"><span class="herodot" style="background:'+CAT_COLOR[g.cat]+'"></span>'+esc(g.name)+'</div>';
  h+='<div class="msub"><span class="tag" style="'+catStyle(g.cat)+'">'+esc(g.cat)+'</span> &nbsp;'+g.min+'-'+g.max+' 人 · '+g.dur+' 分钟 · '+esc(g.venue.join(' / '))+' · '+esc(g.pl)+' · '+NTXT[g.noise]+' · '+MTXT[g.move]+(g.shy?' · 社恐友好':'')+'</div>';
  h+='<div class="msection"><div class="mtext">'+esc(g.desc)+'</div></div>';

  h+='<div class="msection"><h3>道具</h3>';
  if(!g.props.length){ h+='<div class="mtext" style="color:var(--green)">无需任何道具</div>'; }
  else{
    h+='<table class="ptable"><tr><th>名称</th><th style="text-align:right">数量</th></tr>';
    g.props.forEach(function(p){
      h+='<tr><td>'+esc(p.n)+(p.buy?' <span class="tag buy">需采购</span>':' <span class="tag none">办公室现成</span>')+'</td>'+
         '<td class="num">'+p.q+' '+esc(p.u)+'</td></tr>';
    });
    h+='</table>';
  }
  h+='</div>';

  h+='<div class="msection"><h3 style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>游戏规则</span><button class="btn sm" data-copyrules="'+g.id+'" title="复制规则"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 16V5a2 2 0 0 1 2-2h8"/></svg>复制</button></h3>';
  if(g.steps.length){ h+='<ol class="steps">'; g.steps.forEach(function(s){ h+='<li>'+esc(s)+'</li>'; }); h+='</ol>'; }
  else h+='<div class="mtext" style="font-size:15px;color:var(--faint)">还没有填写规则，点下方「编辑」补充</div>';
  h+='</div>';

  if(g.variants.length){ h+='<div class="msection"><h3>变体玩法</h3><ul class="plain">'; g.variants.forEach(function(s){ h+='<li>'+esc(s)+'</li>'; }); h+='</ul></div>'; }

function fallbackCopy(txt){

function aiBase(){ return state.ai.url.replace(/\/+$/,'')+'/chat/completions'; }
function aiErrText(err){
  var m=(err && err.message) || String(err);
  if(m.indexOf('Failed to fetch')>=0){
    if(location.pathname.indexOf('/static-html/')>=0)
      return '当前 WorkBuddy 内置预览禁止连接外部 AI 接口（CSP 限制），与代理、URL、KEY 和模型无关。请使用交付的 localhost 本地运行地址打开本工具后再测试。';
    return '浏览器无法连接 AI 接口。请检查代理规则、浏览器扩展或网络连接后重试。';
  }
  return m;
}
function aiChat(messages){
  return fetchTimeout(aiBase(), {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.ai.key},
    body: JSON.stringify({model:state.ai.model, messages:messages})
  }, 60000).then(function(res){
    if(!res.ok){
      return res.text().catch(function(){ return ''; }).then(function(t){
        throw new Error('HTTP '+res.status+(t?' · '+t.slice(0,160):''));
      });
    }
    return res.json().then(function(j){
      var txt=j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      if(!txt) throw new Error('响应里没有内容');
      return txt;
    });
  });
}

  h+='<textarea class="field" id="sc_req" rows="4" placeholder="寿星是谁、想突出的环节、特殊流程、忌讳的话…">'+esc(c.scriptReq||'')+'</textarea></div>';
  if(c.script){
    h+='<div class="msection"><h3 style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>主持稿</span>'
      +'<button class="btn sm" id="sc_copy" title="复制主持稿">'+ico('copy')+'复制</button></h3>'
      +'<textarea class="field" id="sc_out" rows="14" style="line-height:1.7">'+esc(c.script)+'</textarea>'
      +'<div class="ehint" style="margin-top:8px">可以直接改，改完自动保存。</div></div>';
  }
  h+='<div class="mafoot"><button class="btn primary" id="sc_go">'+ico('spark')+(c.script?'重新生成':'生成主持稿')+'</button>'
    +(c.script?'<button class="btn" id="sc_clear">清空</button>':'')
    +'<span id="sc_status" style="font-size:14px;color:var(--muted);align-self:center"></span></div></div>';
  var m=$('#modal'); m.innerHTML=h; m.hidden=false; document.body.style.overflow='hidden';
  if(scMsg){ var st=$('#sc_status'); if(st){ st.textContent=scMsg.t; st.style.color=scMsg.c; } scMsg=null; }
}
function genScript(){
  var c=state.cur, reqEl=$('#sc_req');
  if(reqEl) c.scriptReq=reqEl.value.trim();
  save();
  var gs=planGames();
  if(!gs.length){ scMsg={t:'先在游戏库加入这场生日会的游戏，AI 才能按流程写稿。', c:'var(--red)'}; openAiScript(); return; }
  var st=$('#sc_status'), go=$('#sc_go');
  if(st){ st.textContent='AI 生成中，可能需要几十秒…'; st.style.color='var(--muted)'; }
  if(go) go.disabled=true;
  var lines=[], mins=0;
  gs.forEach(function(g,i){
    mins+=+g.dur||0;
    lines.push((i+1)+'. '+g.name+'（'+g.cat+' · '+g.dur+'分钟'+(g.desc?' · '+g.desc:'')+'）');
    if(g.steps&&g.steps.length) lines.push('   规则要点：'+g.steps.join('；'));
  });
  var on=scriptPresets();
  var presetTxt=SCRIPT_PRESETS.filter(function(p){ return on.indexOf(p.k)>=0; }).map(function(p){ return '- '+p.t; }).join('\n');
  var prompt='请为下面这场生日会写一篇完整的主持稿。\n\n'
    +'【生日会信息】\n名称：'+(c.name||'未填写')+'\n主题：'+(c.theme||'未填写')+'\n日期：'+(c.date||'未填写')+'\n人数：'+(c.people||'未填写')+'\n\n'
    +'【流程与游戏（按此顺序进行）】\n'+lines.join('\n')+'\n\n'
    +'【主持稿要求】\n'+(presetTxt||'- 无特殊要求')+'\n\n'
    +'【我的固定要求】\n'+(state.ai.scriptCustom||'无')+'\n\n'
    +'【本次补充要求】\n'+(c.scriptReq||'无')+'\n\n'
    +'【输出要求】\n'
    +'- 纯中文，主持人可以直接照读的口播稿，不要写成提纲。\n'
    +'- 结构：开场白 → 每个游戏前的串场与规则讲解 → 游戏进行中的互动话术 → 结果宣布与颁奖 → 结尾祝福。\n'
    +'- 每个环节用【环节名】开头并标注预计用时，全场总时长约 '+mins+' 分钟。\n'
    +'- 语气自然口语化，像真人说话，不要书面腔。\n'
    +'- 不要使用 markdown 标题符号（#），用【】标注即可。\n'
    +'- 全文控制在 1200 字以内。';
  aiChat([
    {role:'system', content:'你是一位经验丰富的团队生日会主持人兼策划，擅长写可直接照读、气氛热烈的中文主持稿。'},
    {role:'user', content:prompt}
  ]).then(function(txt){
    state.cur.script=String(txt).trim();
    scMsg={t:'已生成，可直接复制使用', c:'var(--green)'};
    save(); openAiScript();
  }).catch(function(err){
    scMsg={t:'生成失败：'+aiErrText(err), c:'var(--red)'};
    openAiScript();
  });
}
function copyScriptText(txt){
  function ok(){ alert('主持稿已复制。'); }
  function fb(){
    var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){ prompt('手动复制：', txt); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fb);
  else fb();
}
$('#btnAiScript').addEventListener('click', openAiScript);
$('#modal').addEventListener('click', function(e){
  var cp=e.target.closest('[data-scp]');
  if(cp){
    var k=cp.getAttribute('data-scp'), arr=scriptPresets(), i=arr.indexOf(k);
    if(i>=0) arr.splice(i,1); else arr.push(k);

  }
  if(e.target.closest('#sc_go')){ genScript(); return; }

});
function aiParseJSON(raw){
  var s=String(raw).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  var a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a<0||b<0) throw new Error('AI 没有返回 JSON');
  return JSON.parse(s.slice(a,b+1));
}
function normalizeAI(o){
  var cats=['破冰暖场','分组对抗','爆笑整蛊','协作挑战','温情收尾'];
  var vens=['会议室','开阔场地','户外','座位上'];
  var pls=['无道具','纸笔','手机','需采购'];
  function int(x,d){ x=+x; return isFinite(x)&&x>0? Math.round(x):d; }
  var g={
    name:String(o.name||'AI 新游戏').slice(0,30),
    cat:cats.indexOf(o.cat)>=0? o.cat : '破冰暖场',
    min:int(o.min,5), max:int(o.max,50),
    dur:int(o.dur,15),
    venue:Array.isArray(o.venue)? o.venue.filter(function(x){return vens.indexOf(x)>=0;}) : [],
    pl:pls.indexOf(o.pl)>=0? o.pl : '无道具',
    props:Array.isArray(o.props)? o.props.map(function(p){ return {n:String(p&&p.n||''), q:int(p&&p.q,1), u:String(p&&p.u||'个'), buy:!!(p&&p.buy), p:+(p&&p.p)||0}; }).filter(function(p){return p.n;}) : [],
    noise:[1,2,3].indexOf(+o.noise)>=0? +o.noise : 2,
    move:[1,2,3].indexOf(+o.move)>=0? +o.move : 2,
    shy:!!o.shy,
    desc:String(o.desc||'').slice(0,120),
    steps:Array.isArray(o.steps)? o.steps.map(String) : [],
    variants:Array.isArray(o.variants)? o.variants.map(String) : [],
    pits:Array.isArray(o.pits)? o.pits.map(String) : [],
    plan:o.plan||null
  };
  if(!g.venue.length) g.venue=['开阔场地'];
  if(!g.steps.length) g.steps=['根据现场人数完成分组或站位','主持人说明目标、顺序和判定方式','所有参与者按规则完成游戏','达到结束条件后公布结果'];
  if(!g.variants.length) g.variants=['根据现场人数调整分组和轮次'];
  if(!g.pits.length) g.pits=['开始前确认场地安全，并完整讲解规则'];
  if(g.max<g.min) g.max=g.min;
  return g;
}
function fetchTimeout(url, opts, ms){
  opts=opts||{};
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  if(ctl) opts.signal=ctl.signal;
  var timer=setTimeout(function(){ if(ctl) ctl.abort(); }, ms||60000);
  return fetch(url, opts).then(function(r){ clearTimeout(timer); return r; }, function(err){
    clearTimeout(timer);
    if(err && err.name==='AbortError') throw new Error('请求超时，请检查 VPN 或稍后重试');
    throw err;
  });
}
function fetchXHS(url){
  return fetchTimeout('https://r.jina.ai/'+url, {}, 20000).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  });
}
function aiGenerate(){
  var text=$('#ai_text')? $('#ai_text').value.trim() : '';
  var st=$('#ai_status'), go=$('#ai_go');
  if(!text && !aiImgs.length){ st.textContent='先输入文字 / 链接，或拖入图片。'; return; }
  var m=text.match(XHS_RE);
  if(m){
    st.textContent='正在读取小红书笔记…'; st.style.color='var(--muted)'; go.disabled=true;
    fetchXHS(m[0]).then(function(md){
      var imgs=[], re=/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/g, mm;
      while((mm=re.exec(md)) && imgs.length<6) imgs.push(mm[1]);
      var clean=md.replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\n{3,}/g,'\n\n').trim().slice(0,6000);
      if(!clean) clean='（未能提取到笔记正文）';
      var extra=text.replace(m[0],'').trim();
      st.textContent='笔记读取成功，AI 生成中…';
      doGenerate('【小红书笔记原文】\n'+clean+(extra?'\n\n【用户补充】'+extra:''), imgs);
    }).catch(function(err){
      go.disabled=false;
      st.textContent='读取小红书失败（'+(err.message||'网络不通')+'，读取服务国内直连可能被墙，开代理后可重试）。也可以直接把笔记文字复制粘贴过来，或把笔记截图拖进来。';
      st.style.color='var(--red)';
    });
    return;
  }
  doGenerate(text, []);
}
function doGenerate(text, extraUrls){
  var st=$('#ai_status'), go=$('#ai_go');
  if(!st){ closeModal(); return; }
  st.textContent='AI 生成中，可能需要十几秒…'; st.style.color='var(--muted)'; go.disabled=true;
  var sys='你是公司生日会游戏策划。请把用户提供的文字和图片整理成一个适合公司生日会的团体游戏，并严格匹配当前游戏详情页的字段和展示顺序。只输出一个 JSON 对象，不要 markdown 代码块，不要解释。模板顺序和字段如下：'
    +'【基本信息】name(游戏名,不超过12字),cat(环节,只能是破冰暖场/分组对抗/爆笑整蛊/协作挑战/温情收尾),min(最少人数数字),max(最多人数数字),dur(时长分钟数字),venue(适用场地数组,只能取会议室/开阔场地/户外/座位上),pl(道具级别,只能取无道具/纸笔/手机/需采购),noise(音量数字1安静/2中等/3吵闹),move(运动量数字1原地/2走动/3跑动),shy(社恐友好布尔),desc(一句话简介,不超过40字)；'
    +'【游戏规则】steps(规则分步字符串数组,必须4-6步,每步一句话,内容要能直接复制到 PPT)；'
    +'【变体玩法】variants(字符串数组,2-3条)；【踩坑提醒】pits(字符串数组,1-3条)；【道具清单】props(数组,每项{n:名称,q:数量数字,u:单位,buy:是否需采购布尔,p:单价数字})。不要生成主持人口播字段。所有字段都必须返回，不能省略。';
  var content=[{type:'text',text: text || '请根据图片内容设计一个生日会游戏'}];
  aiImgs.forEach(function(u){ content.push({type:'image_url',image_url:{url:u}}); });
  (extraUrls||[]).forEach(function(u){ content.push({type:'image_url',image_url:{url:u}}); });
  aiChat([{role:'system',content:sys},{role:'user',content:content}]).then(function(raw){
    var obj=normalizeAI(aiParseJSON(raw));
    closeModal();
    openEditor(null, obj);
  }).catch(function(err){
    st.textContent='生成失败：'+aiErrText(err); st.style.color='var(--red)'; go.disabled=false;
  });
}

/* ---------- 云端同步（腾讯云 CloudBase · 独立集合 bgh_sync + 独立云函数 bghsync） ---------- */
var SYNC_API='https://openxin-d4g2wm7v431a4bbbf-1458194381.ap-shanghai.app.tcloudbase.com/bghsync';
function syncOn(){ return !!(state.sync && state.sync.code); }
function setDot(mode){
  var d=$('#syncDot'); if(!d) return;
  var m={off:['#c7c7cc','同步未配置'],ok:['#34c759','已同步到云端'],ing:['#ff9500','云端同步中…'],err:['#ff3b30','云端同步失败，点设置查看']};
  var v=m[mode]||m.off;
  d.style.background=v[0]; d.title=v[1]+(state.sync.lastSync?(' · 最近同步 '+new Date(state.sync.lastSync).toLocaleTimeString()):'');
}
function updateDot(){ setDot(syncOn()? 'ok' : 'off'); }
var syncTimer=null, syncing=false, pullTimer=null;
function scheduleSync(){
  if(!syncOn()){ updateDot(); return; }
  clearTimeout(syncTimer); setDot('ing');
  syncTimer=setTimeout(syncPush, 1500);
}
function applyRemote(payload){
  if(!payload || (payload._ts||0) <= (state._ts||0)) return false;
  ['stars','logs','user','edits','hidden','aiGames'].forEach(function(k){ if(payload[k]!==undefined) state[k]=payload[k]; });
  if(payload.cur) state.cur=Object.assign({id:'',name:'',theme:'',who:'',date:'',people:'',items:[],scriptReq:'',script:'',aiPlanReq:'',aiPlan:[],archived:false}, payload.cur);
  if(payload.ai) state.ai=Object.assign({}, state.ai, payload.ai);
  state._ts=payload._ts||Date.now(); state.sync.lastSync=Date.now();
  rawSave(); syncPlanInputs(); refreshAll();
  return true;
}
function syncPush(){
  if(!syncOn() || syncing) return;
  syncing=true; setDot('ing');
  fetch(SYNC_API+'?code='+encodeURIComponent(state.sync.code))
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(remote){
    var remoteTs=(remote && remote._ts)||0;
    if(remoteTs > (state._ts||0)){
      /* 云端比本机新：本机可能是还没同步过的新设备，禁止推送覆盖云端，改为拉取 */
      return syncPull().then(function(){ state.sync.lastSync=Date.now(); rawSave(); });
    }
    var payload=Object.assign({}, state); delete payload.sync;
    payload._ts=Date.now(); state._ts=payload._ts;
    return fetch(SYNC_API+'?code='+encodeURIComponent(state.sync.code), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); state.sync.lastSync=Date.now(); rawSave(); });
  })
  .then(function(){ syncing=false; setDot('ok'); })
  .catch(function(){ syncing=false; setDot('err'); });
}
function syncPull(then){
  if(!syncOn()) return Promise.resolve();
  return fetch(SYNC_API+'?code='+encodeURIComponent(state.sync.code))
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(j){ if(applyRemote(j && j.payload) && then) then(); })
  .catch(function(){ setDot('err'); });
}
function startSyncLoop(){
  if(!syncOn()) return;
  syncPull();
  clearInterval(pullTimer);
  pullTimer=setInterval(function(){ if(!document.hidden && !syncing) syncPull(); }, 30000);
  window.addEventListener('focus', function(){ if(!syncing) syncPull(); });
}

/* ---------- 视图切换 ---------- */
document.querySelector('.tabs').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  var v=b.getAttribute('data-view');
  document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.remove('on'); });

  if(v==='plan') renderPlan();
  if(v==='log'){ renderLogQueryOpts(); renderLogQuery(); renderLogs(); renderStats(); }
});

if('scrollRestoration' in history) history.scrollRestoration='manual';
window.scrollTo(0,0);
load();
autoArchiveExpired();
syncPlanInputs();
renderLogQueryOpts();
renderLib();
renderPlan();

renderLogs();
renderStats();
updateDot();
startSyncLoop();
